name: Site audit

on:
  schedule:
    - cron: "0 1 * * *"
    - cron: "0 13 * * *"
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run audit:site
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: site-audit
          path: audit-results/site-audit.json
          retention-days: 30
