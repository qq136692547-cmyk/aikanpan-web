          - heading "二、热点解读" [level=2] [ref=e1497]
          - paragraph [ref=e1498]:
            - strong [ref=e1499]: 1. 军工板块领涨
            - text: 地面兵装、航空装备相关板块涨幅居前，军工方向今日表现突出。这通常与地缘事件催化或行业订单预期改善有关，属于事件驱动型行情，持续性需观察后续消息面跟进。
          - paragraph [ref=e1500]:
            - strong [ref=e1501]: 2. 消费板块回暖
            - text: 化妆品、宠物食品、人工景区等消费方向集体走强，反映市场对消费复苏预期的博弈。这类板块弹性较大，适合轻仓参与结构性机会，但不宜追高。
          - paragraph [ref=e1502]:
            - strong [ref=e1503]: 3. 制造与新材料
            - text: 玻纤制造、橡胶制品等偏制造业板块也有不错表现，可能与出口数据或原材料价格预期有关，属于基本面驱动的轮动。
          - heading "三、操作建议" [level=2] [ref=e1504]
          - list [ref=e1505]:
            - listitem [ref=e1506]:
              - strong [ref=e1507]: 指数层面
              - text: ：今日收跌但幅度可控，3948 附近仍是关键支撑区域，短期可观察能否企稳。
            - listitem [ref=e1508]:
              - strong [ref=e1509]: 结构层面
              - text: ：军工、消费是今日主线，但军工偏事件驱动，追高风险较大；消费方向若回调可关注低吸机会。
            - listitem [ref=e1510]:
              - strong [ref=e1511]: 仓位管理
