          - generic [ref=f17e261]:
            - generic [ref=f17e262]:
              - heading "爱看盘的数据可靠吗？" [level=3] [ref=f17e263]
              - paragraph [ref=f17e264]: 行情数据来自东方财富、新浪财经、Finnhub、EODHD 等公开接口， 我们不做二次加工，直接呈现原始数值。AI 内容由大语言模型生成，仅供参考，不构成投资建议。
            - generic [ref=f17e265]:
              - heading "爱看盘支持美股吗？" [level=3] [ref=f17e266]
              - paragraph [ref=f17e267]: 支持。美股覆盖真实行情、K 线、新闻、AI 解读、自选、持仓、交易流水、盯盘提醒、财报盈利数据与研究台。
            - generic [ref=f17e268]:
              - heading "盯盘提醒怎么用？" [level=3] [ref=f17e269]
              - paragraph [ref=f17e270]: 在盯盘页用自然语言输入条件，例如「贵州茅台跌破 1600 就提醒我」。 页面打开时每 15 秒刷新触发记录并发送浏览器通知；关闭页面后浏览器通知停止，绑定手机号后还可开启短信提醒。
            - generic [ref=f17e271]:
              - heading "爱看盘收费吗？" [level=3] [ref=f17e272]
              - paragraph [ref=f17e273]:
                - text: 基础功能免费使用；AI 高频功能可通过闲鱼购买 Pro 时长卡，月卡 ¥19/30 天、年卡 ¥199/365 天，不自动续费。购买前需绑定邮箱或手机号。可在
                - link "关于页" [ref=f17e274] [cursor=pointer]:
                  - /url: /about/
                - text: 查看说明。
        - generic [ref=f17e275]:
          - text: 爱看盘同时提供鸿蒙原生 APP 版本，让你随时随地查看行情和接收盯盘提醒。无论是短线盯盘、中长线研究还是新手学习，爱看盘都能为你提供合适的功能和视角。本站所有数据仅供参考，不构成投资建议，投资有风险，入市需谨慎。作者：爱看盘团队 · 更新日期：2026-09-12 ·
