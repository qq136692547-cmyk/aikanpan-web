            - paragraph [ref=f1e969]: 今日美股三大指数全线收跌，科技权重股普遍承压，市场风险偏好明显回落。
            - paragraph [ref=f1e970]:
              - strong [ref=f1e971]: 指数表现
              - text: 标普500跌0.69%，道指跌0.55%，纳指跌幅最大达1.29%。成长股领跌，显示资金对高估值板块的担忧加剧。
            - paragraph [ref=f1e972]:
              - strong [ref=f1e973]: 个股分化
              - text: 苹果逆势上涨1.33%，成为科技巨头中唯一红盘，显示资金对部分龙头仍有配置意愿。特斯拉跌幅超2.5%居科技股首位，亚马逊、英伟达、微软均跌超1%。Netflix基本持平，防御属性相对突出。
            - paragraph [ref=f1e974]:
              - strong [ref=f1e975]: 核心驱动
              - text: 10年期美债收益率升至2025年1月以来高位，对成长股估值形成压制。中东地缘冲突升级推动油价上涨，抵押贷款利率同步走高至2025年6月以来峰值，宏观环境对风险资产构成双重压力。Citadel提示当前风险收益比恶化，历史数据显示本月往往表现疲软。
            - paragraph [ref=f1e976]:
              - strong [ref=f1e977]: 操作参考
              - text: 当前宏观扰动加大，建议控制仓位、避免追高，关注财报季中基本面扎实的个股。苹果今日相对强势，可观察其能否延续抗跌性。
          - paragraph [ref=f1e978]: ⚠ 本内容由 AI 生成，不构成投资建议
