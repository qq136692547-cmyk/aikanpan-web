            - generic [ref=f70e262]:
              - heading "爱看盘的数据可靠吗？" [level=3] [ref=f70e263]
              - paragraph [ref=f70e264]: 行情数据来自东方财富、新浪财经、Finnhub、EODHD 等公开接口， 我们不做二次加工，直接呈现原始数值。AI 内容由大语言模型生成，仅供参考，不构成投资建议。
            - generic [ref=f70e265]:
              - heading "爱看盘支持美股吗？" [level=3] [ref=f70e266]
              - paragraph [ref=f70e267]: 支持。美股覆盖真实行情、K 线、新闻、AI 解读、自选、持仓、交易流水、盯盘提醒、财报盈利数据与研究台。
            - generic [ref=f70e268]:
              - heading "盯盘提醒怎么用？" [level=3] [ref=f70e269]
              - paragraph [ref=f70e270]: 在盯盘页用自然语言输入条件，例如「贵州茅台跌破 1600 就提醒我」。 页面打开时每 15 秒刷新触发记录并发送浏览器通知；关闭页面后浏览器通知停止，绑定手机号后还可开启短信提醒。
            - generic [ref=f70e271]:
              - heading "爱看盘收费吗？" [level=3] [ref=f70e272]
              - paragraph [ref=f70e273]:
                - text: 基础功能免费使用；AI 高频功能可通过闲鱼购买 Pro 时长卡，月卡 ¥19/30 天、年卡 ¥199/365 天，不自动续费。购买前需绑定邮箱或手机号。可在
